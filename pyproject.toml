[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workbuddy-desktop-bridge"
version = "0.4.3"
description = "Bounded, cancellable MCP workers for WorkBuddy Desktop on Windows"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "mcp>=1.0,<2", "tomlkit>=0.13,<1", "pywin32>=310; sys_platform == 'win32'"]

[project.scripts]
workbuddy-bridge = "workbuddy_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["workbuddy_bridge*"]

[tool.setuptools.package-data]
workbuddy_bridge = ["*.cjs"]
